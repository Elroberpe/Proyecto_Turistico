<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chasqui PERÚ | Finalizar Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.jsp"><span class="text-primary">Chasqui</span> PERÚ</a>
        </div>
    </nav>
    
    <div class="container mt-5 pt-5">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="payment-card" id="resumenReserva"></div>
            </div>
            <div class="col-md-6">
                <div class="payment-card">
                    <h3 class="text-center mb-4"><i class="bi bi-credit-card"></i> Método de Pago</h3>
                    <form id="paymentForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Selecciona método de pago</label>
                            <select id="metodoPago" class="form-select" required>
                                <option value="tarjeta">💳 Tarjeta de Crédito/Débito</option>
                                <option value="yape">📱 Yape</option>
                                <option value="plin">📱 Plin</option>
                            </select>
                        </div>
                        
                        <div id="tarjetaFields">
                            <div class="mb-3">
                                <label class="form-label">Número de tarjeta</label>
                                <input type="text" id="numeroTarjeta" class="form-control" placeholder="**** **** **** ****">
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <label class="form-label">Fecha expiración</label>
                                    <input type="text" id="fechaExp" class="form-control" placeholder="MM/AA">
                                </div>
                                <div class="col-6">
                                    <label class="form-label">CVV</label>
                                    <input type="password" id="cvv" class="form-control" placeholder="***">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nombre del titular</label>
                                <input type="text" id="titular" class="form-control" placeholder="Como aparece en la tarjeta">
                            </div>
                        </div>
                        
                        <div id="qrFields" style="display: none;">
                            <div class="qr-code text-center p-4" style="background: #f0ede7; border-radius: 20px;">
                                <i class="bi bi-qr-code" style="font-size: 100px; color: var(--primary);"></i>
                                <p class="mt-3">Escanea el código QR desde tu aplicación</p>
                                <p class="text-muted">Código de referencia: <strong>CH-2026-001</strong></p>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mt-3 btn-lg">
                            <i class="bi bi-lock"></i> Pagar ahora
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="footer mt-5">
        <div class="container text-center">
            <p>&copy; 2026 Chasqui PERÚ - Tu aventura comienza aquí</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script>
        function cargarResumenReserva() {
            const reservaStr = localStorage.getItem('reservaActual');
            if (!reservaStr) {
                window.location.href = 'index.html';
                return;
            }
            
            const reserva = JSON.parse(reservaStr);
            const container = document.getElementById('resumenReserva');
            
            if (container) {
                container.innerHTML = `
                    <h3 class="mb-4 text-primary"><i class="bi bi-receipt"></i> Factura Electrónica</h3>
                    <div class="invoice-detail">
                        <div class="row"><div class="col-6 text-muted">Destino:</div><div class="col-6 fw-bold">${reserva.destino.nombre}</div></div>
                        <div class="row"><div class="col-6 text-muted">Tipo:</div><div class="col-6 fw-bold">${reserva.tipoViaje === 'roundtrip' ? 'Ida y Vuelta' : 'Solo Ida'}</div></div>
                        <div class="row"><div class="col-6 text-muted">Salida:</div><div class="col-6 fw-bold">${reserva.fechaSalida}</div></div>
                        ${reserva.fechaRetorno ? `<div class="row"><div class="col-6 text-muted">Retorno:</div><div class="col-6 fw-bold">${reserva.fechaRetorno}</div></div>` : ''}
                        <div class="row"><div class="col-6 text-muted">Noches:</div><div class="col-6 fw-bold">${reserva.noches}</div></div>
                        <div class="row"><div class="col-6 text-muted">Pasajeros:</div><div class="col-6 fw-bold">${reserva.pasajeros}</div></div>
                        <hr>
                        <div class="row"><div class="col-6 text-muted">Subtotal:</div><div class="col-6">S/ ${reserva.subtotal.toFixed(2)}</div></div>
                        <div class="row"><div class="col-6 text-muted">IGV (18%):</div><div class="col-6">S/ ${reserva.igv.toFixed(2)}</div></div>
                        <div class="row"><div class="col-6 fw-bold">TOTAL:</div><div class="col-6 fw-bold total-grande">S/ ${reserva.precioTotal.toFixed(2)}</div></div>
                    </div>
                    <div class="alert alert-info mt-3 small"><i class="bi bi-info-circle"></i> Pago 100% seguro. Datos encriptados.</div>
                `;
            }
        }
        
        function initEventosPago() {
            const metodoPago = document.getElementById('metodoPago');
            const tarjetaFields = document.getElementById('tarjetaFields');
            const qrFields = document.getElementById('qrFields');
            const paymentForm = document.getElementById('paymentForm');
            
            if (metodoPago) {
                metodoPago.addEventListener('change', (e) => {
                    if (e.target.value === 'tarjeta') {
                        tarjetaFields.style.display = 'block';
                        qrFields.style.display = 'none';
                    } else {
                        tarjetaFields.style.display = 'none';
                        qrFields.style.display = 'block';
                    }
                });
            }
            
            if (paymentForm) {
                paymentForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    procesarPago();
                });
            }
        }
        
        function procesarPago() {
            const metodoPago = document.getElementById('metodoPago').value;
            
            if (metodoPago === 'tarjeta') {
                const numeroTarjeta = document.getElementById('numeroTarjeta').value;
                const cvv = document.getElementById('cvv').value;
                const fechaExp = document.getElementById('fechaExp').value;
                
                const regexTarjeta = /^\d{16}$/;
                const regexCVV = /^\d{3}$/;
                const regexFecha = /^(0[1-9]|1[0-2])\/\d{2}$/;
                
                if (!regexTarjeta.test(numeroTarjeta.replace(/\s/g, ''))) {
                    alert('❌ Número de tarjeta inválido (16 dígitos)');
                    return;
                }
                if (!regexCVV.test(cvv)) {
                    alert('❌ CVV inválido (3 dígitos)');
                    return;
                }
                if (!regexFecha.test(fechaExp)) {
                    alert('❌ Fecha expiración inválida (MM/AA)');
                    return;
                }
            }
            
            const btnPagar = document.querySelector('#paymentForm button[type="submit"]');
            btnPagar.innerHTML = '<i class="bi bi-hourglass-split"></i> Procesando...';
            btnPagar.disabled = true;
            
            setTimeout(() => {
                const reserva = JSON.parse(localStorage.getItem('reservaActual'));
                let confirmadas = JSON.parse(localStorage.getItem('reservasConfirmadas')) || [];
                confirmadas.push({ ...reserva, estado: 'confirmada', fechaPago: new Date().toLocaleString() });
                localStorage.setItem('reservasConfirmadas', JSON.stringify(confirmadas));
                localStorage.removeItem('reservaActual');
                alert('✅ ¡Pago exitoso! Tu reserva ha sido confirmada.');
                window.location.href = 'index.jsp';
            }, 2000);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            cargarResumenReserva();
            initEventosPago();
        });
    </script>
</body>
</html>
